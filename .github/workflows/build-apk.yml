name: Build Safwan Keyboard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Change package name to match Kotlin
        run: |
          sed -i 's/package="com.safwan.keyboard"/package="com.safwan.keyboard2027"/g' app/src/main/AndroidManifest.xml
        continue-on-error: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: safwan-keyboard-2027-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
